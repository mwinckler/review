[package]
name = "review"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven, persistent branch review TUI for Git and Jujutsu"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
