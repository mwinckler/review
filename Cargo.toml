[package]
name = "review"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven, persistent branch review TUI for Git and Jujutsu"
license = "MIT"

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

[dev-dependencies]
nix = { version = "0.31", features = ["term", "fs"] }
