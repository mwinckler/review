[package]
name = "review"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven, persistent branch review TUI for Git and Jujutsu"
license = "MIT"

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
directories = "6"
edtui = { version = "0.11.7", default-features = false }
fs2 = "0.4"
percent-encoding = "2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
tui-markdown = { version = "0.3.12", default-features = false }
url = "2"

[dev-dependencies]
nix = { version = "0.31", features = ["term", "fs"] }
